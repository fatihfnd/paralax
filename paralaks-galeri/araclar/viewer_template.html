<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ · paralaks pencere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #1f2629;
    --wall-deep: #161b1d;
    --ink: #e6dfd2;
    --ink-dim: #a39c90;
    --brass: #b8955a;
    --panel: rgba(22, 27, 29, 0.92);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--wall); color: var(--ink); overflow: hidden;
    font-family: "Spectral", Georgia, "Times New Roman", serif; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #frame { position: fixed; pointer-events: none;
    box-shadow: 0 0 0 200vmax var(--wall),
                inset 0 0 0 1px rgba(184,149,90,.35),
                inset 0 0 60px 10px rgba(0,0,0,.55); }
  #frame::after { content: ""; position: absolute; inset: -14px; border: 1px solid rgba(184,149,90,.18); }
  header { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(16px, env(safe-area-inset-top));
    font-size: 15px; line-height: 1.4; color: var(--ink-dim); max-width: 40ch; }
  header strong { display: block; font-weight: 600; color: var(--ink); font-size: 17px; }
  #hint { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    font-style: italic; color: var(--ink-dim); font-size: 15px; transition: opacity .6s; text-align: center; }
  #panel { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    width: 260px; background: var(--panel); border: 1px solid rgba(184,149,90,.25); border-radius: 3px;
    padding: 14px 16px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
  #panel.closed > :not(#toggle) { display: none; }
  #toggle { position: absolute; right: 8px; top: 6px; background: none; border: 0; color: var(--ink-dim);
    font-size: 18px; cursor: pointer; padding: 2px 6px; }
  #panel.closed { width: auto; padding: 6px 36px 6px 12px; }
  #panel.closed::before { content: "Ayarlar"; color: var(--ink-dim); }
  button.main { width: 100%; padding: 9px 10px; margin-bottom: 12px; background: var(--brass); color: #1b1712;
    border: 0; border-radius: 2px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button.main:disabled { opacity: .55; cursor: default; }
  button.sec { background: none; border: 1px solid rgba(230,223,210,.3); color: var(--ink); border-radius: 2px;
    padding: 6px 10px; font: 13px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  label { display: block; margin: 10px 0 2px; color: var(--ink-dim); }
  label output { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--brass); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  #cam { width: 96px; height: 72px; object-fit: cover; transform: scaleX(-1); background: #000; border-radius: 2px;
    display: none; }
  #status { color: var(--ink-dim); line-height: 1.35; flex: 1; min-height: 2.7em; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--ink-dim); }
  #camOnly { display: none; }
  [hidden] { display: none !important; }
  header .sub { display: block; font-style: italic; margin-bottom: 6px; }
  #back { position: fixed; right: max(20px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top));
    color: var(--ink-dim); text-decoration: none; font-size: 15px; border-bottom: 1px solid rgba(184,149,90,.4); }
  #back:hover, #back:focus-visible { color: var(--ink); }
  @media (max-width: 560px) { header { display: none; } #panel { width: calc(100% - 32px); } }
  @media (prefers-reduced-motion: reduce) { #hint { transition: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="gl" aria-label="Kafa hareketine göre derinlik kazanan resim"></canvas>
<div id="frame"></div>
__BACK__
<header><strong>__TITLE__</strong><span class="sub">__SUB__</span>Resmin önünde başını sağa sola, yukarı aşağı hareket ettir; pencereden bakar gibi arkasını görürsün.</header>
<div id="hint">Fareyi resmin üzerinde gezdir ya da kamerayı aç</div>

<aside id="panel" aria-label="Ayarlar">
  <button id="toggle" aria-label="Paneli kapat/aç">–</button>
  <button class="main" id="camBtn">Kamerayla kafa takibini başlat</button>
  <div class="row"><video id="cam" playsinline muted></video><div id="status">Şu an fare ile kontrol ediliyor.</div></div>
  <label>Derinlik <output id="oDepth"></output></label>
  <input type="range" id="depth" min="0.1" max="1.5" step="0.05" value="0.7">
  <label>Hareket etkisi <output id="oGain"></output></label>
  <input type="range" id="gain" min="0.5" max="3" step="0.1" value="1.5">
  <div class="row" id="gyroRow" hidden><button class="sec" id="gyroBtn">Telefonu eğerek bak</button></div>
  <div id="camOnly">
    <label>Ekran yüksekliği (cm) <output id="oScr"></output></label>
    <input type="range" id="scr" min="8" max="45" step="0.5" value="19">
  </div>
  <div class="row" id="centerRow" hidden><button class="sec" id="center">Şu anki konumu merkez al</button></div>
  <label class="check"><input type="checkbox" id="tint"> Katmanları renklendir</label>
</aside>

<script>const DATA = /*__DATA__*/null;</script>
<script>
(async function () {
  const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const FACE_MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
  const $ = (id) => document.getElementById(id);
  const canvas = $("gl"), frameEl = $("frame");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x1f2629);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera();
  camera.matrixAutoUpdate = true;

  const imgAspect = DATA.W / DATA.H, PAD = DATA.pad;
  const state = { S: 0.7, gain: 1.5, scrCm: 19, D0: 2.8, ph: 0.8, a: 1, ww: 1, wh: 1 };

  // ---------- assets ----------
  const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const layers = [];
  for (const L of DATA.layers) {
    const [im, dimg] = await Promise.all([loadImg(L.img), loadImg(L.depth)]);
    const c = document.createElement("canvas"); c.width = dimg.width; c.height = dimg.height;
    const cx = c.getContext("2d"); cx.drawImage(dimg, 0, 0);
    const px = cx.getImageData(0, 0, c.width, c.height).data;
    const dep = new Float32Array(c.width * c.height);
    for (let k = 0; k < dep.length; k++) dep[k] = (px[k * 4] * 256 + px[k * 4 + 1]) / 65535;
    const tex = new THREE.Texture(im);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.needsUpdate = true;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
    mesh.renderOrder = layers.length;
    scene.add(mesh);
    layers.push({ mesh, dep, dw: c.width, dh: c.height });
  }
  const sampleDepth = (L, u, v) => {
    const x = u * (L.dw - 1), y = v * (L.dh - 1);
    const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, L.dw - 1), y1 = Math.min(y0 + 1, L.dh - 1);
    const fx = x - x0, fy = y - y0, d = L.dep, w = L.dw;
    return (d[y0 * w + x0] * (1 - fx) + d[y0 * w + x1] * fx) * (1 - fy) + (d[y1 * w + x0] * (1 - fx) + d[y1 * w + x1] * fx) * fy;
  };

  // ---------- geometry: each layer is a displaced sheet, pre-scaled so it lines up from the nominal eye ----------
  function buildGeometry() {
    const ph = state.ph, Wp = ph * imgAspect * (1 + 2 * PAD), Hp = ph * (1 + 2 * PAD);
    const SX = 220, SY = Math.round(SX * Hp / Wp), D0 = state.D0;
    for (const L of layers) {
      const g = new THREE.PlaneGeometry(Wp, Hp, SX, SY);
      const pos = g.attributes.position, uv = g.attributes.uv;
      for (let k = 0; k < pos.count; k++) {
        const u = uv.getX(k), v = 1 - uv.getY(k);
        const z = -state.S * ph * sampleDepth(L, u, v);
        const s = (D0 - z) / D0;
        pos.setXYZ(k, pos.getX(k) * s, pos.getY(k) * s, z);
      }
      L.mesh.geometry.dispose();
      L.mesh.geometry = g;
    }
  }

  function layout() {
    const cw = innerWidth, ch = innerHeight;
    renderer.setSize(cw, ch, false);
    state.a = cw / ch;
    state.wh = Math.min(0.80, 0.84 * state.a / imgAspect);   // window height in world units (1 = canvas height)
    state.ww = state.wh * imgAspect;
    state.ph = state.wh / 0.97;                               // painting slightly larger than the window
    const wpx = state.ww * ch, hpx = state.wh * ch;
    Object.assign(frameEl.style, { left: (cw - wpx) / 2 + "px", top: (ch - hpx) / 2 + "px", width: wpx + "px", height: hpx + "px" });
    buildGeometry();
  }

  // ---------- off-axis projection: the screen is a fixed window, the eye moves ----------
  function setEye(ex, ey, ez) {
    const n = 0.02, f = 100, a = state.a;
    camera.position.set(ex, ey, ez);
    camera.rotation.set(0, 0, 0);
    camera.updateMatrixWorld();
    camera.projectionMatrix.makePerspective(
      (-a / 2 - ex) * n / ez, (a / 2 - ex) * n / ez, (0.5 - ey) * n / ez, (-0.5 - ey) * n / ez, n, f);
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  }

  // ---------- smoothing (One Euro filter) ----------
  class OneEuro {
    constructor(minCut = 1.2, beta = 0.6, dCut = 1) { Object.assign(this, { minCut, beta, dCut, x: null, dx: 0, t: 0 }); }
    alpha(cut, dt) { const r = 2 * Math.PI * cut * dt; return r / (r + 1); }
    f(x, t) {
      if (this.x === null) { this.x = x; this.t = t; return x; }
      const dt = Math.max(1e-3, (t - this.t) / 1000); this.t = t;
      const dx = (x - this.x) / dt; this.dx += this.alpha(this.dCut, dt) * (dx - this.dx);
      const cut = this.minCut + this.beta * Math.abs(this.dx);
      this.x += this.alpha(cut, dt) * (x - this.x); return this.x;
    }
  }
  const fx = new OneEuro(), fy = new OneEuro(), fz = new OneEuro(0.6, 0.2);

  // ---------- input: demo sway → mouse → camera ----------
  let mode = "demo", target = { x: 0, y: 0, z: state.D0 }, eye = { x: 0, y: 0, z: state.D0 };
  const hint = $("hint");
  addEventListener("pointermove", (e) => {
    if (mode === "camera" || mode === "gyro") return;
    if (mode === "demo") { mode = "mouse"; hint.style.opacity = 0; }
    const g = state.gain;
    target.x = (e.clientX / innerWidth - 0.5) * 0.45 * g;
    target.y = -(e.clientY / innerHeight - 0.5) * 0.3 * g;
    target.z = state.D0;
  });

  let tracker = null, video = $("cam"), lastVT = -1, calib = null, lastHead = null;
  const status = (t) => { $("status").textContent = t; };
  $("camBtn").onclick = async () => {
    const btn = $("camBtn"); btn.disabled = true;
    try {
      status("Kamera izni bekleniyor…");
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
      video.srcObject = stream; await video.play(); video.style.display = "block";
      status("Yüz modeli yükleniyor…");
      const { FaceLandmarker, FilesetResolver } = await import(MP);
      const fs = await FilesetResolver.forVisionTasks(MP + "/wasm");
      const opts = (delegate) => ({ baseOptions: { modelAssetPath: FACE_MODEL, delegate }, runningMode: "VIDEO", numFaces: 1 });
      try { tracker = await FaceLandmarker.createFromOptions(fs, opts("GPU")); }
      catch { tracker = await FaceLandmarker.createFromOptions(fs, opts("CPU")); }
      mode = "camera"; hint.style.opacity = 0; calib = null; lastHead = null;
      $("camOnly").style.display = "block"; $("centerRow").hidden = false; $("gyroRow").hidden = true;
      btn.textContent = "Kafa takibi açık";
      status("Yüzün aranıyor…");
    } catch (err) {
      btn.disabled = false;
      status(err && err.name === "NotAllowedError"
        ? "Kamera izni verilmedi. Fareyle devam edebilirsin."
        : "Kamera ya da model açılamadı (" + (err.message || err) + "). Dosyayı Chrome'da aç; olmazsa yerel sunucu üzerinden dene.");
    }
  };

  const HFOV = 62 * Math.PI / 180, IPD_CM = 6.3;
  function readHead(now) {
    if (!tracker || video.readyState < 2 || video.currentTime === lastVT) return;
    lastVT = video.currentTime;
    const r = tracker.detectForVideo(video, now);
    const lm = r.faceLandmarks && r.faceLandmarks[0];
    if (!lm) { status("Yüz görünmüyor — merkeze dönülüyor."); target.x *= 0.95; target.y *= 0.95; return; }
    const vw = video.videoWidth, vh = video.videoHeight, tH = Math.tan(HFOV / 2);
    const A = lm[468], B = lm[473];                         // iris centres
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const ipd = Math.hypot(A.x - B.x, (A.y - B.y) * vh / vw);
    const zCm = IPD_CM / (ipd * 2 * tH);
    const xCm = (0.5 - mx) * 2 * tH * zCm;
    const yCm = (0.5 - my) * 2 * tH * (vh / vw) * zCm;
    lastHead = { xCm, yCm, zCm };
    if (!calib) center();
    const canvasHcm = state.scrCm * (innerHeight / screen.height);
    target.x = state.gain * (xCm - calib.xCm) / canvasHcm;
    target.y = state.gain * (yCm - calib.yCm) / canvasHcm;
    target.z = Math.max(0.6, zCm / canvasHcm);
    status("Takip ediliyor · uzaklık ≈ " + zCm.toFixed(0) + " cm");
  }
  function center() {
    if (mode === "gyro") { if (gyroLast) gyroRef = { ...gyroLast }; return; }
    if (!lastHead) return;
    calib = { ...lastHead };
    const canvasHcm = state.scrCm * (innerHeight / screen.height);
    state.D0 = Math.max(0.8, lastHead.zCm / canvasHcm);
    buildGeometry();
  }
  $("center").onclick = center;
  addEventListener("keydown", (e) => { if (e.key === "c" || e.key === "C") center(); });

  // ---------- device tilt (phones/tablets) ----------
  const touch = matchMedia("(pointer: coarse)").matches;
  const needsPerm = typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function";
  let gyroRef = null, gyroLast = null, gyroOn = false;
  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    gyroLast = { b: e.beta, g: e.gamma };
    if (mode === "demo" || (mode === "mouse" && touch)) startGyroMode();
  }
  function startGyroMode() {
    if (mode === "camera") return;
    mode = "gyro"; gyroRef = null; hint.style.opacity = 0;
    $("gyroRow").hidden = true; $("centerRow").hidden = false;
    status("Telefonun eğimiyle kontrol ediliyor. Rahat tuttuğun açıda “merkez al”a bas.");
  }
  function listenGyro() {
    if (gyroOn || typeof DeviceOrientationEvent === "undefined") return;
    gyroOn = true; addEventListener("deviceorientation", onOrient);
  }
  if (touch && !needsPerm) listenGyro();                    // Android: izin gerekmiyor, ilk veriyle kendiliğinden başlar
  if (touch && needsPerm) $("gyroRow").hidden = false;      // iOS: kullanıcı dokunuşuyla izin istenmeli
  $("gyroBtn").onclick = async () => {
    try {
      if (needsPerm && (await DeviceOrientationEvent.requestPermission()) !== "granted") {
        status("Hareket sensörü izni verilmedi. Parmağınla sürükleyerek bakabilirsin."); return;
      }
      listenGyro();
      status("Sensör bekleniyor…");
    } catch (err) { status("Hareket sensörüne erişilemedi (" + (err.message || err) + ")."); }
  };
  const SIN15 = Math.sin(15 * Math.PI / 180);
  function readGyro() {
    if (!gyroLast) return;
    if (!gyroRef) gyroRef = { ...gyroLast };
    const r = Math.PI / 180, clamp = (v) => Math.max(-35, Math.min(35, v));
    let dg = gyroLast.g - gyroRef.g, db = gyroLast.b - gyroRef.b;
    if (dg > 90) dg -= 180; if (dg < -90) dg += 180;        // gamma ±90 sıçraması
    const dx = -Math.sin(clamp(dg) * r) / SIN15, dy = Math.sin(clamp(db) * r) / SIN15;
    const ang = (((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) % 360 + 360) % 360;
    let sx = dx, sy = dy;
    if (ang === 90) { sx = -dy; sy = dx; } else if (ang === 270) { sx = dy; sy = -dx; } else if (ang === 180) { sx = -dx; sy = -dy; }
    target.x = state.gain * 0.3 * sx;
    target.y = state.gain * 0.2 * sy;
    target.z = state.D0;
  }

  // ---------- controls ----------
  const bind = (id, key, out, fmt, rebuild) => {
    const el = $(id), o = $(out);
    const upd = () => { state[key] = +el.value; o.textContent = fmt(state[key]); if (rebuild) buildGeometry(); };
    el.addEventListener("input", upd); upd();
  };
  bind("depth", "S", "oDepth", (v) => v.toFixed(2), true);
  bind("gain", "gain", "oGain", (v) => v.toFixed(1) + "×", false);
  bind("scr", "scrCm", "oScr", (v) => v.toFixed(1), false);
  $("tint").onchange = (e) => layers.forEach((L, i) => {
    L.mesh.material.color.setHSL(e.target.checked ? (i / layers.length) * 0.8 : 0, e.target.checked ? 0.7 : 0, e.target.checked ? 0.6 : 1);
  });
  $("toggle").onclick = () => { const p = $("panel"); p.classList.toggle("closed"); $("toggle").textContent = p.classList.contains("closed") ? "+" : "–"; };

  // ---------- loop ----------
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now) {
    if (mode === "demo" && !reduceMotion) {
      const t = now / 1000;
      target.x = Math.sin(t * 0.7) * 0.25; target.y = Math.sin(t * 1.4) * 0.06; target.z = state.D0;
    }
    if (mode === "camera") readHead(now);
    if (mode === "gyro") readGyro();
    eye.x = fx.f(target.x, now); eye.y = fy.f(target.y, now); eye.z = fz.f(target.z, now);
    setEye(eye.x, eye.y, eye.z);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  if (touch) {
    hint.textContent = "Telefonu hafifçe eğ ya da parmağınla sürükle";
    $("status").textContent = "Dokunarak ya da telefonu eğerek bakabilirsin.";
    $("scr").value = 14; $("scr").dispatchEvent(new Event("input"));
  }
  if (innerWidth < 560) { $("panel").classList.add("closed"); $("toggle").textContent = "+"; }
  addEventListener("resize", layout);
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
